<!DOCTYPE html>
<html>
<head>
    <title>Loan Payment Calculator</title>
    <script>
        function calculatePayment() {
            let PV = parseFloat(document.getElementById("loanAmount").value);
            let n = parseFloat(document.getElementById("years").value);
            let r = parseFloat(document.getElementById("interestRate").value);

            let P = ((r/100/12) * PV) / (1-(1+(r/100/12))**-(n*12));

            document.getElementById("result").innerHTML =
                "If you have a $" + PV + " loan for " + n +
                " years at " + r + " interest, your monthly payment will be $" +
                P.toFixed(2) + ".";
        }
    </script>
</head>
<body>
    <h1>Loan Payment Calculator</h1>

    <label for="loanAmount">Loan Amount ($):</label>
    <input type="number" id="loanAmount" value="25000">
    <br><br>

    <label for="years">Number of Years:</label>
    <input type="number" id="years" value="6">
    <br><br>

    <label for="interestRate">Annual Interest Rate (%):</label>
    <input type="number" id="interestRate" value="6">
    <br><br>

    <button onclick="calculatePayment()">Calculate Payment</button>

    <p id="result"></p>
</body>
</html>
